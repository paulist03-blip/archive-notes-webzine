<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paul's Apple TV - Paul Archive Notes</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171512;
      --muted: #69645c;
      --line: #ded8cd;
      --paper: #f7f3eb;
      --panel: #fffdf8;
      --forest: #1d4d45;
      --brick: #9a3f2f;
      --violet: #51466b;
      --gold: #b37b21;
      --blue: #315f7c;
      --shadow: 0 18px 48px rgba(28, 24, 18, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      line-height: 1.72;
    }

    a {
      color: inherit;
    }

    .hero {
      min-height: 78vh;
      display: grid;
      align-items: end;
      padding: 40px clamp(18px, 5vw, 72px) 34px;
      background:
        linear-gradient(180deg, rgba(19, 18, 16, 0.08), rgba(19, 18, 16, 0.88)),
        url("https://is1-ssl.mzstatic.com/image/thumb/_LWChsLxuaPE72FcNYFmtg/1200x675.jpg") center / cover;
      color: #fffdf8;
    }

    .hero-inner {
      width: min(1120px, 100%);
    }

    .eyebrow {
      margin: 0 0 14px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 253, 248, 0.78);
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: clamp(42px, 8vw, 94px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .hero-copy {
      max-width: 760px;
      margin: 24px 0 0;
      font-size: clamp(17px, 2vw, 22px);
      color: rgba(255, 253, 248, 0.88);
    }

    .top-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px clamp(14px, 4vw, 48px);
      background: rgba(247, 243, 235, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .top-nav a {
      flex: 0 0 auto;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
    }

    main {
      padding-bottom: 64px;
    }

    .shortcut-band {
      width: min(1120px, calc(100% - 36px));
      margin: 34px auto 46px;
    }

    .shortcut-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .shortcut-card {
      position: relative;
      min-height: 132px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #111;
      color: #fffdf8;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(28, 24, 18, 0.08);
    }

    .shortcut-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.02) contrast(1.02);
      transition: transform 220ms ease;
    }

    .shortcut-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 11, 10, 0.05), rgba(12, 11, 10, 0.72));
    }

    .shortcut-card:hover img {
      transform: scale(1.035);
    }

    .shortcut-title {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 11px;
      z-index: 1;
      display: grid;
      gap: 1px;
    }

    .shortcut-title strong {
      font-size: 15px;
      line-height: 1.25;
    }

    .shortcut-title span {
      color: rgba(255, 253, 248, 0.74);
      font-size: 12px;
    }

    .show-section {
      border-top: 1px solid var(--line);
      padding: 58px clamp(18px, 5vw, 72px);
    }

    .show-head {
      width: min(1120px, 100%);
      margin: 0 auto 28px;
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(280px, 0.58fr);
      gap: clamp(20px, 4vw, 44px);
      align-items: stretch;
    }

    .show-copy {
      display: flex;
      flex-direction: column;
      justify-content: end;
    }

    .show-copy .label {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .show-copy h2 {
      margin: 0;
      font-size: clamp(34px, 6vw, 72px);
      line-height: 1.03;
      letter-spacing: 0;
    }

    .show-copy h2 span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: clamp(18px, 2.4vw, 28px);
      font-weight: 700;
    }

    .show-copy p {
      max-width: 690px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .show-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .show-links a {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .show-links a.imdb-link {
      background: #f4c542;
      border-color: #d5a82b;
      color: #16130e;
    }

    .show-art {
      margin: 0;
      min-height: 260px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #111;
    }

    .show-art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: contrast(1.06) saturate(1.06) brightness(1.02);
    }

    .season-nav {
      width: min(1120px, 100%);
      margin: 0 auto 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .season-nav a {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .season-block {
      width: min(1120px, 100%);
      margin: 0 auto 36px;
      scroll-margin-top: 78px;
    }

    .season-heading {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .episodes {
      display: grid;
      gap: 22px;
    }

    .episode {
      min-width: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(28, 24, 18, 0.08);
    }

    .episode[open] {
      box-shadow: var(--shadow);
    }

    .episode summary {
      list-style: none;
      cursor: pointer;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 20px clamp(18px, 3vw, 28px);
    }

    .episode summary::-webkit-details-marker {
      display: none;
    }

    .episode-titleline {
      min-width: 0;
    }

    .episode-titleline h3 {
      margin: 10px 0 0;
      display: grid;
      gap: 4px;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.18;
      letter-spacing: 0;
    }

    .episode-titleline .title-ko {
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 700;
    }

    .episode-toggle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--forest);
      background: #fffaf0;
      font-size: 24px;
      line-height: 1;
      transition: transform 180ms ease, background 180ms ease;
    }

    .episode[open] .episode-toggle {
      transform: rotate(45deg);
      background: #e9f0ea;
    }

    .episode-panel {
      display: grid;
      grid-template-columns: 1fr;
      border-top: 1px solid var(--line);
    }

    .episode-media {
      position: relative;
      margin: 0;
      min-width: 0;
      aspect-ratio: 16 / 9;
      max-height: 640px;
      background: #111;
      overflow: hidden;
    }

    .episode-media::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--episode-bg) center / cover no-repeat;
      filter: blur(22px) saturate(1.08) brightness(0.72);
      transform: scale(1.08);
      opacity: 0.88;
    }

    .episode-media img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      filter: contrast(1.06) saturate(1.06) brightness(1.02);
    }

    .episode-media::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(180deg, rgba(8, 8, 8, 0.02), rgba(8, 8, 8, 0.15) 44%, rgba(8, 8, 8, 0.82)),
        linear-gradient(90deg, rgba(8, 8, 8, 0.42), rgba(8, 8, 8, 0));
      pointer-events: none;
    }

    .episode-art-caption {
      position: absolute;
      left: clamp(16px, 3vw, 28px);
      right: clamp(16px, 3vw, 28px);
      bottom: clamp(16px, 3vw, 28px);
      z-index: 3;
      max-width: 780px;
      color: #fffdf8;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.58);
    }

    .episode-art-caption span {
      display: inline-flex;
      margin-bottom: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.16);
      border: 1px solid rgba(255, 253, 248, 0.3);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .episode-art-caption strong,
    .episode-art-caption em {
      display: block;
    }

    .episode-art-caption strong {
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1.05;
    }

    .episode-art-caption em {
      margin-top: 6px;
      color: rgba(255, 253, 248, 0.78);
      font-style: normal;
      font-size: clamp(15px, 1.8vw, 19px);
      font-weight: 700;
    }

    .episode-body {
      min-width: 0;
      padding: clamp(20px, 4vw, 34px);
    }

    .drama-background {
      margin: 0 0 20px;
      padding: 17px 18px;
      border: 1px solid #d8d0c2;
      border-radius: 8px;
      background: #f8f2e6;
      color: #514a41;
    }

    .drama-background h4 {
      margin: 0 0 8px;
      color: #1f1b16;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .drama-background p {
      margin: 0;
      font-size: 15px;
      line-height: 1.65;
    }

    .episode-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      color: #fff;
      font-size: 13px;
    }

    .episode-meta .meta-pill,
    .episode-meta .rating {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 86px;
      min-height: 32px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(22, 19, 14, 0.1);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1;
      white-space: nowrap;
    }

    .episode-meta .meta-pill {
      background: var(--forest);
      color: #fffdf8;
    }

    .episode-meta .runtime {
      min-width: 70px;
      background: var(--brick);
    }

    .episode-meta .rating {
      gap: 4px;
      background: var(--gold);
      color: #16130e;
    }

    .episode-meta .rating.pending {
      background: var(--violet);
      color: #fffdf8;
    }

    .episode-meta .rating.critic {
      background: #efefe8;
      color: #1d4d45;
      border-color: #cfd8cb;
    }

    .episode-meta .rating.critic.pending {
      background: #e8e3ee;
      color: var(--violet);
      border-color: #d6cce2;
    }

    .episode-meta a.rating {
      color: #16130e;
      text-decoration: none;
    }

    .episode-meta a.rating.critic {
      color: #1d4d45;
    }

    .official {
      margin: 0 0 18px;
      padding-left: 14px;
      border-left: 3px solid var(--gold);
      color: var(--muted);
      font-size: 15px;
    }

    .official strong,
    .official span {
      display: block;
    }

    .official strong {
      margin-bottom: 4px;
      color: #433d35;
      font-weight: 800;
    }

    .philosophy-thread {
      margin: 18px 0 0;
      padding: 16px 18px;
      border: 1px solid #c9d0bf;
      border-radius: 8px;
      background: #eef3e9;
      color: #263126;
    }

    .philosophy-thread h4 {
      margin: 0 0 6px;
      font-size: 17px;
      line-height: 1.3;
    }

    .philosophy-thread .thread-note {
      margin: 0 0 10px;
      color: #51614f;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .philosophy-thread .concept-name {
      margin-bottom: 8px;
      color: #1e2b1f;
      font-size: 17px;
      font-weight: 900;
    }

    .philosophy-thread p {
      margin: 0 0 10px;
      font-size: 16px;
      line-height: 1.62;
    }

    .philosophy-thread p:last-child {
      margin-bottom: 0;
    }

    .philosophy-thread .question {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(81, 97, 79, 0.28);
      font-weight: 800;
    }

    .philosophy-thread .reading-list {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(81, 97, 79, 0.22);
      color: #3f4d3d;
      font-size: 14px;
      line-height: 1.55;
    }

    .philosophy-thread .reading-list span {
      display: block;
      margin-bottom: 6px;
      color: #263126;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .philosophy-thread .reading-list ul {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .philosophy-thread .reading-list a {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      padding: 5px 9px;
      border: 1px solid rgba(81, 97, 79, 0.22);
      border-radius: 8px;
      background: rgba(255, 253, 248, 0.62);
      color: #263126;
      text-decoration: none;
      font-weight: 800;
    }

    .bilingual-review {
      display: grid;
      gap: 18px;
      margin-top: 22px;
    }

    .review-language {
      padding: clamp(18px, 3vw, 24px);
      border: 1px solid color-mix(in srgb, var(--line), var(--gold) 28%);
      border-radius: 8px;
      background: #fbf7ee;
    }

    .review-language.english {
      background: #fffdf8;
    }

    .review-language.korean {
      background: #f7f0e5;
    }

    .review-language h4 {
      margin: 0 0 6px;
      font-size: 17px;
      line-height: 1.3;
    }

    .review-language .lang-note {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .review-language p {
      margin: 0 0 16px;
      color: #403a32;
      font-size: 16px;
      line-height: 1.78;
    }

    .review-language.english p {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.72;
    }

    .review-language p:last-child {
      margin-bottom: 0;
    }

    .rating-note {
      width: min(1120px, 100%);
      margin: 0 auto 22px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8e7;
      color: #5e4b25;
      font-size: 14px;
    }

    .source-band {
      border-top: 1px solid var(--line);
      padding: 42px clamp(18px, 5vw, 72px) 16px;
    }

    .source-inner {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .source-inner h2 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .source-inner ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }

    footer {
      padding: 28px clamp(18px, 5vw, 72px) 42px;
      color: var(--muted);
      font-size: 14px;
    }

    footer p {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    footer .made-by {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 840px) {
      .show-head,
      .episode-panel {
        grid-template-columns: 1fr;
      }

      .shortcut-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .shortcut-card {
        min-height: 118px;
      }

      .episode summary {
        grid-template-columns: 1fr;
      }

      .episode-toggle {
        width: 100%;
        height: 36px;
        border-radius: 8px;
      }

      .hero {
        min-height: 70vh;
      }

      .show-art {
        min-height: 210px;
      }

      .episode-media {
        aspect-ratio: 16 / 9;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Apple TV+ Drama REVIEW NOTES</p>
      <h1>Paul's Apple TV</h1>
      <p class="hero-copy">Apple TV+ 드라마를 회차별로 길게 읽는 개인 리뷰 노트. 각 화의 줄거리, 인물의 선택, 장면의 분위기를 중심으로 상세히 리뷰하고 관련 저작과 논문을 곁들인 철학적 에세이를 덧붙였다.</p>
    </div>
  </header>

  <nav class="top-nav" aria-label="작품 바로가기">
    <a href="#widows">위도우스 베이의 저주</a>
    <a href="#starcity">스타 시티</a>
    <a href="#severance">세브란스: 단절</a>
    <a href="#pluribus">플루리부스</a>
    <a href="#silo">사일로</a>
  </nav>

  <main>
    <section class="shortcut-band" aria-label="작품 바로가기">
      <div class="shortcut-grid" id="show-shortcuts"></div>
    </section>

    <div id="review-root"></div>

    <section class="source-band">
      <div class="source-inner">
        <h2>출처</h2>
        <ul id="source-list"></ul>
      </div>
    </section>
  </main>

  <footer>
    <p>작성일: 2026년 6월 26일. 이 페이지는 개인 감상 정리를 위한 비상업적 리뷰 허브다. <a href="index.html">Paul Archive Notes로 돌아가기</a><span class="made-by">made by PAUL</span></p>
  </footer>

  <script>
    const shows = [
      {
        id: "widows",
        title: "위도우스 베이의 저주",
        original: "Widow's Bay",
        source: "https://tv.apple.com/kr/show/%E1%84%8B%E1%85%B1%E1%84%83%E1%85%A9%E1%84%8B%E1%85%AE%E1%84%89%E1%85%B3-%E1%84%87%E1%85%A6%E1%84%8B%E1%85%B5%E1%84%8B%E1%85%B4-%E1%84%8C%E1%85%A5%E1%84%8C%E1%85%AE---widows-bay/umc.cmc.1zzly0vah46bnvnwf0qkrjhh2",
        hero: "https://is1-ssl.mzstatic.com/image/thumb/dbM6jIeJXl_iprjNJVjCfA/1200x675.jpg",
        thesis: "관광 안내문처럼 웃으며 시작하지만, 문장마다 불길함을 한 방울씩 떨어뜨리는 섬 이야기다. 이 작품의 재미는 공포를 크게 외치는 순간보다, 마을 전체가 이미 무엇인가를 알고 있다는 듯 행동하는 온도 차에서 나온다.",
        episodes: [
          {
            n: 1,
            title: "위도우스 베이에 오신 것을 환영합니다!",

    const deepNotes = {
      "widows-1": ["환대의 문장 자체가 함정처럼 작동한다. 섬은 처음부터 외부인을 반기는 척하면서도, 들어온 사람에게 이곳의 규칙을 받아들이라고 요구한다.", "안개는 단순한 분위기가 아니라 정보의 은폐 방식이다. 보이지 않는 것은 자연현상인 동시에 마을의 선택처럼 느껴진다.", "첫 화의 가장 중요한 감정은 호기심보다 불신이다. 이 불신이 이후 회차를 읽는 기본 시야가 된다."],
      "widows-2": ["여관은 임시 거처가 아니라 기억의 보관소에 가깝다. 방 하나하나가 사적인 비밀과 공동체의 역사 사이에 놓여 있다.", "시장의 시범은 안전 확인이 아니라 불안을 관리하는 정치적 공연이다. 모두가 보는 앞에서 위험을 부정해야 하는 이유가 더 의심스럽다.", "공포의 속도가 느린 대신 공간의 밀도가 높다. 문, 복도, 빈방이 사건보다 먼저 관객을 압박한다."],
      "widows-3": ["바다는 해방의 이미지가 아니라 경계선으로 쓰인다. 섬을 둘러싼 물은 탈출로이면서 동시에 봉쇄선이다.", "해변 개장식은 축제가 아니라 오래된 위험을 반복해서 길들이는 의례처럼 보인다.", "히치하이커 경고는 위협이 한 종류가 아님을 암시한다. 자연, 사람, 전설이 같은 위험망 안에 들어온다."],
      "widows-4": ["책은 휴식의 소품이 아니라 세계를 다르게 읽게 만드는 위험한 물건이다.", "자기계발서를 금지하는 농담은 개인의 변화 가능성을 경계하는 공동체의 본능을 드러낸다.", "이 회차는 공포의 무대를 외부 공간에서 내면의 독해 행위로 옮긴다. 무엇을 읽느냐가 곧 무엇을 의심하느냐가 된다."],
      "widows-5": ["통행금지는 마을의 불안을 제도화하는 순간이다. 소문이 행정 언어로 바뀌면 공포는 더 차갑고 현실적이 된다.", "아이들을 언급하는 대목은 공동체의 미래가 위협받고 있음을 보여준다. 보호의 언어 안에 통제의 욕망이 섞인다.", "이 회차부터 여행 안내문은 생존 매뉴얼처럼 읽힌다. 관광객의 시선은 주민의 공포를 따라잡기 시작한다."],
      "widows-6": ["마을의 역사는 사실의 기록보다 기억의 편집에 가깝다. 아름다운 이야기라는 말이 반복될수록 빠진 부분이 더 크게 느껴진다.", "결혼과 충성의 언어는 사랑을 말하지만, 동시에 소유와 의무의 그림자를 남긴다.", "6화의 핵심은 저주가 초자연적 사건만이 아닐 수 있다는 점이다. 공동체가 자기 과거를 미화하는 방식 자체가 저주의 일부처럼 보인다."],
      "starcity-1": ["여성 우주비행 임무는 진보의 얼굴을 하고 있지만, 동시에 국가 선전의 완벽한 이미지가 된다.", "아나스타시아에게 쏟아지는 시선은 축하와 감시를 구분하기 어렵게 만든다.", "우주 경쟁의 무대가 하늘이라고 해도, 이 드라마의 진짜 중력은 지상의 정치와 젠더 권력에서 나온다."],
      "starcity-2": ["유명세는 보호막이 아니라 더 좁은 울타리로 작동한다. 세계의 중심에 선 사람일수록 자기 방을 잃는다.", "정보전은 이 작품의 우주 개발을 인간관계의 전쟁으로 바꾼다. 기술보다 누가 누구를 믿는지가 중요해진다.", "사슬에 묶인 곰이라는 이미지는 강력하지만 움직임이 제한된 체제와 인물을 동시에 설명한다."],
      "starcity-3": ["춤의 은유는 정치적 협상의 불안정함을 잘 드러낸다. 모두가 박자를 맞추지만 누구도 음악을 완전히 통제하지 못한다.", "예상치 못한 만남은 체제가 제거하려는 우연의 힘을 보여준다.", "달의 우위는 안정이 아니라 끝없는 증명의 압박이다. 앞서 있다는 사실이 인물들을 더 몰아붙인다."],
      "starcity-4": ["유명세의 숲은 길이 많아 보이지만 실제로는 탈출구가 적다. 아나스타시아의 얼굴은 공적 재산처럼 소비된다.", "이리나의 추적은 진실을 향한 움직임이면서 권력의 금지구역으로 들어가는 행위다.", "어두운 숲은 냉전적 불확실성의 은유다. 친구와 적, 충성심과 공포가 명확히 나뉘지 않는다."],
      "starcity-5": ["압박이 모든 전선으로 확장되면서 사적인 감정도 전략 자원이 된다.", "제목은 뒤늦은 후회와 자기 통제의 실패를 떠올리게 한다. 인물들은 자신이 만든 선택을 물어뜯고 싶어 한다.", "이 회차의 긴장은 폭발적 사건보다 침묵의 계산에서 온다. 말하지 않는 얼굴이 가장 많은 정보를 품는다."],
      "starcity-6": ["계획의 붕괴는 체제의 신앙이 깨지는 순간이다. 완벽한 통제라는 믿음이 흔들릴 때 사람들은 예상보다 인간적으로 반응한다.", "송곳의 이미지는 숨긴 진실이 결국 표면을 뚫고 나온다는 예고처럼 작동한다.", "IMDb 평점이 아직 집계되지 않은 점도 이 회차의 현재성을 보여준다. 오늘 공개된 회차는 아직 관객 반응이 숫자로 굳기 전이다."],
      "severance-1": ["루먼의 사무실은 미래적이라기보다 이상하게 오래된 관료제처럼 보인다. 새 기술이 낡은 복종을 더 정교하게 만든다.", "마크의 승진은 권한의 획득보다 상실의 은폐에 가깝다. 올라갈수록 더 많이 모르게 된다.", "헬리의 거부는 관객의 윤리적 위치를 만든다. 이상한 세계를 이상하다고 말하는 사람이 있어야 세계의 균열이 보인다."],

      "severance-4": ["책의 등장은 회사가 통제하지 못하는 언어의 침입이다. 읽는 행위는 자기 인식의 시작이 된다.", "헬리와 아우티의 갈등은 같은 몸 안의 권리 문제를 전면화한다.", "마크의 슬픔은 단절 시술이 감정을 완전히 제거하지 못한다는 사실을 보여준다. 벽이 있어도 여진은 남는다."],
      "severance-5": ["부서 간 신화는 정보 부족이 만든 작은 종교처럼 보인다. 모르면 두려워하고, 두려우면 적으로 만든다.", "복도로 나가는 행위는 회사의 지도를 다시 그리는 행위다.", "디자인의 잔인함은 아름다움이 사람의 움직임을 통제할 때 발생한다. 루먼은 추해서 무서운 곳이 아니라 너무 정돈되어서 무섭다."],
      "severance-6": ["동맹은 루먼이 가장 경계하는 형태의 의미 생산이다. 직원들이 서로를 해석하기 시작하면 회사의 설명이 흔들린다.", "코벨의 분노는 통제의 실패보다 관계의 발생에 대한 두려움에 가깝다.", "숨바꼭질의 놀이성은 잔혹하다. 이 세계에서 숨는 것은 생존이고, 발견되는 것은 처벌이 될 수 있다."],
      "pluribus-1": ["행복이 공포가 되는 이유는 그것이 선택이 아니라 상태로 강요되기 때문이다.", "캐럴의 불쾌함은 세계의 결함을 감지하는 장치다. 모두가 평온할수록 그녀의 화가 더 의미 있어진다.", "우리는 우리라는 문장은 공동체의 따뜻함과 개인의 소거를 동시에 품는다."],

      "pluribus-3": ["호의가 거절 불가능해질 때 그것은 새로운 폭력이 된다.", "캐럴의 분노는 사회성이 부족해서가 아니라 자기 감정의 경계를 지키려는 시도다.", "진솔한 대화가 폭발하는 구조는 이 작품의 핵심 역설이다. 진실이 많다고 관계가 쉬워지는 것은 아니다."],
      "pluribus-4": ["캐럴이 세계의 경계를 시험하는 순간, 주인공은 피해자에서 실험자로 이동한다.", "솔직함만 있는 세계는 사생활의 방을 없앤다. 거짓말이 사라져도 권력은 사라지지 않는다.", "멀리 있는 또 다른 사람의 존재는 고립의 위로이자 새로운 갈등의 씨앗이다."],

      "pluribus-6": ["발견은 사건의 답이 아니라 책임의 시작이다. 알게 된 사람은 더 이상 방관자로 남을 수 없다.", "라스베이거스 축은 행복과 욕망의 관계를 풍자적으로 비춘다. 죄악의 도시는 오히려 솔직한 욕망의 실험실이 된다.", "HDP라는 약어는 감정극의 표면 아래 차가운 시스템이 있음을 암시한다."],

      "silo-2": ["줄리엣의 기술자 정체성은 세계를 말이 아니라 흔적으로 읽게 만든다.", "죽음의 원인을 묻는 일은 사일로에서 금지된 현실의 균열을 만지는 일이다.", "이 회차는 주인공 교체가 아니라 시선의 교체다. 위쪽의 법에서 아래쪽의 물질로 진실의 중심이 이동한다."],

        `${ep.koDesc} 이 흐름은 단순한 사건 설명에 머물지 않고, 인물들이 무엇을 알고도 말하지 못하며 무엇을 모르기 때문에 움직일 수밖에 없는지를 드러낸다. ${focus.stakes}. 그래서 ${concept.name}${topicParticle(concept.name)} 작품 밖에서 억지로 덧붙인 해석이 아니라, 장면 안에서 시선과 침묵, 책임의 방향을 조직하는 논리로 작동한다.`,

    const philosophicalThread = (show, season, ep) => {

      return {
        chapter,
        conceptName: concept.name,
        paragraphs: philosophyEssay(show, season, ep, concept),
        readings: philosophyReadings[concept.name] || [],
        questionKo: philosophyQuestionsKo[concept.name] || `질문: 이 회차는 ${concept.name}${topicParticle(concept.name)} 인물의 기억과 권력, 책임을 어떻게 다시 생각하게 만드는가?`

                        <span class="meta-pill">S${season.number}E${String(ep.n).padStart(2, "0")}</span>
                        <span class="meta-pill runtime">${ep.durationKo || ep.duration}</span>
                        ${ratingMarkup(show.id, season.number, ep.n)}
                      </div>
                      <h3><span class="title-en">${ep.en}</span><span class="title-ko">${ep.ko}</span></h3>
                    </div>
                    <span class="episode-toggle" aria-hidden="true">+</span>
                  </summary>
                  <div class="episode-panel">
                    <figure class="episode-media" style="--episode-bg: url('${displayEpisodeImage(ep.image)}')">
                      <img src='${displayEpisodeImage(ep.image)}' srcset="${episodeSrcset(ep.image)}" sizes="(max-width: 840px) calc(100vw - 36px), 1120px" alt="${show.original} ${ep.en} 회차 이미지" loading="lazy" decoding="async" data-fallback-src='${ep.image}' data-final-fallback="${hiResHero(show.hero)}">
                      <figcaption class="episode-art-caption">
                        <span>S${season.number}E${String(ep.n).padStart(2, "0")}</span>
                        <strong>${ep.en}</strong>
                        <em>${ep.ko}</em>
                      </figcaption>
                    </figure>
                    <div class="episode-body">
                      <div class="drama-background">
                        <h4>Drama Background</h4>
                        <p>${episodeBackground(show, season, ep)}</p>
                      </div>
                      <p class="official"><strong>${ep.desc}</strong><span>${ep.koDesc}</span></p>
                      ${episodeReviewMarkup(show, season, ep)}
                      ${philosophyMarkup(show, season, ep)}
                    </div>
                  </div>
                </details>
              `).join("")}
            </div>
          </section>
        `).join("")}
      </section>
    `).join("");

    sourceList.innerHTML = shows.map(show => `
      <li><a href='${show.source}' target="_blank" rel="noreferrer">${show.title} · Apple TV</a> / <a href='${imdbLinks[show.id]}' target="_blank" rel="noreferrer">IMDb episode ratings</a> / <a href='${tvmazeLinks[show.id]}' target="_blank" rel="noreferrer">TVmaze episode ratings</a></li>
    `).join("");

    document.querySelectorAll(".episode-media img").forEach(img => {
      img.addEventListener("error", () => {
        if (!img.dataset.usedFallback && img.dataset.fallbackSrc) {
          img.dataset.usedFallback = "true";
          img.srcset = "";
          img.src = img.dataset.fallbackSrc;
          img.closest(".episode-media")?.style.setProperty("--episode-bg", `url('${img.dataset.fallbackSrc}')`);
          return;
        }
        if (!img.dataset.usedFinalFallback && img.dataset.finalFallback) {
          img.dataset.usedFinalFallback = "true";
          img.srcset = "";
          img.src = img.dataset.finalFallback;
          img.closest(".episode-media")?.style.setProperty("--episode-bg", `url('${img.dataset.finalFallback}')`);
        }
      });
    });

    document.querySelectorAll(".show-section").forEach(section => {
      section.querySelectorAll("details.episode").forEach(details => {
        details.addEventListener("toggle", () => {
          if (!details.open) return;
          section.querySelectorAll("details.episode[open]").forEach(openDetails => {
            if (openDetails !== details) openDetails.open = false;
          });
        });
      });
    });
  </script>
</body>
</html>
